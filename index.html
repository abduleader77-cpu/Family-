<style>
  :root {
    --paper: #FFFDF7; --ink: #2B2112; --soft: #7A6A4F;
    --gold: #B8892B; --gold-d: #8A6414; --gold-l: #E6C66A; --line: #E8D9B0;
    --gold-grad: linear-gradient(135deg, #8A6414, #D9B451 45%, #B8892B);
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html, body { height: 100%; background: var(--paper); }
  body { font-family: var(--sans); color: var(--ink); -webkit-tap-highlight-color: transparent; }

  /* watermark behind every page */
  .wm { position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='170'><text x='120' y='90' text-anchor='middle' transform='rotate(-28 120 85)' font-family='Georgia,serif' font-size='30' letter-spacing='7' fill='%23B8892B' fill-opacity='0.10'>FAMILY</text></svg>"); }

  .app { position: relative; z-index: 1; height: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; }
  .top { display: flex; align-items: center; padding: 8px 12px 0; }
  .back { width: 44px; height: 44px; border: 0; background: none; color: var(--gold-d); font-size: 1.6rem; cursor: pointer; border-radius: 14px; }
  .back:disabled { opacity: 0; pointer-events: none; }
  .brand { flex: 1; text-align: center; font-family: var(--serif); letter-spacing: .4em; font-size: .95rem; font-weight: 700; color: var(--gold-d); padding-left: .4em; }
  .count { width: 44px; text-align: right; font-size: .85rem; color: var(--soft); }
  .inst { width: 40px; height: 40px; border: 0; background: none; color: var(--gold-d); font-size: 1.3rem; cursor: pointer; border-radius: 12px; }
  .progress { display: flex; gap: 4px; padding: 8px 18px 4px; }
  .progress i { flex: 1; height: 3px; border-radius: 2px; background: var(--line); transition: background .3s; }
  .progress i.on { background: var(--gold-grad); }

  .stage { flex: 1; overflow-y: auto; padding: 14px 20px 18px; display: flex; }
  .page { margin: auto; width: 100%; text-align: center; }
  .page.enter { animation: in .4s ease; }
  @keyframes in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  .orn { display: flex; align-items: center; gap: 10px; color: var(--gold); margin: 14px auto; max-width: 240px; }
  .orn::before, .orn::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--gold)); }
  .orn::after { transform: scaleX(-1); }

  .photo { width: 150px; height: 190px; margin: 0 auto; border-radius: 75px 75px 14px 14px; padding: 4px; background: var(--gold-grad); box-shadow: 0 10px 24px rgba(138, 100, 20, .25); }
  .photo > * { width: 100%; height: 100%; display: block; object-fit: cover; border-radius: 71px 71px 10px 10px; background: #F5ECD3; }

  h1, h2 { font-family: var(--serif); font-weight: 700; line-height: 1.15; outline: none; }
  h1 { font-size: 1.9rem; margin-top: 16px; }
  .role { color: var(--gold-d); font-size: .8rem; letter-spacing: .18em; text-transform: uppercase; margin-top: 4px; }
  .cards { margin-top: 6px; text-align: left; }
  .card { background: rgba(255,255,255,.85); border: 1px solid var(--line); border-radius: 14px; padding: 11px 16px 13px; margin-top: 10px; }
  .card b { display: block; font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--gold-d); margin-bottom: 3px; }
  .card p { font-size: 1rem; line-height: 1.45; }

  .eyebrow { font-size: .8rem; letter-spacing: .3em; text-transform: uppercase; color: var(--gold-d); }
  .big { font-size: 2.6rem; margin: 10px 0 4px; background: var(--gold-grad); -webkit-background-clip: text; background-clip: text; color: transparent; letter-spacing: .04em; }
  .quote { font-family: var(--serif); font-style: italic; font-size: 1.2rem; line-height: 1.5; color: var(--gold-d); margin: 6px 6px 0; }
  .speech { line-height: 1.65; font-size: 1.02rem; margin: 0 4px; color: var(--ink); }
  .sign { font-family: var(--serif); font-style: italic; color: var(--gold-d); margin-top: 14px; }

  .bar { padding: 10px 20px max(14px, env(safe-area-inset-bottom)); }
  .go { width: 100%; height: 56px; border: 0; border-radius: 28px; background: var(--gold-grad); color: #fff; text-shadow: 0 1px 1px rgba(60, 40, 0, .45);
        font: 700 1.05rem var(--sans); letter-spacing: .04em; cursor: pointer; box-shadow: 0 4px 0 #6E4E0E, 0 10px 20px rgba(138, 100, 20, .25); transition: transform .06s, box-shadow .06s; }
  .go:active { transform: translateY(3px); box-shadow: 0 1px 0 #6E4E0E; }
  .go.granted { background: var(--gold-d); }
  .go:focus-visible, .back:focus-visible { outline: 3px solid var(--gold-d); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .page.enter { animation: none; } * { transition: none !important; } }
</style>

      funny: 'He is the type of boy who hardly listens, always playing, going out, and doing things his own way.',
      cool: 'Naturally energetic, playful and social, he loves exploring rather than staying in one place.' },
    { kind: 'note', eyebrow: 'With gratitude', title: 'THANK YOU',
      quote: '\u201CFamily is not an important thing. It is everything.\u201D',
      speech: 'To every one of you, thank you for the love, the laughter, the prayers and the support. You are the reason this family is strong, and we are grateful for you today and always. Thank you, family.',
      sign: 'With love and appreciation', last: true }
  ];

  (function () {
    const $ = id => document.getElementById(id);
    const total = PAGES.length;
    let i = 0, busy = false;
    const prog = $('progress');
    for (let n = 0; n < total; n++) prog.appendChild(document.createElement('i'));
    const silhouette = '<svg viewBox="0 0 100 125" aria-hidden="true"><circle cx="50" cy="48" r="19" fill="#D9B451" opacity=".6"/><path d="M14 125c2-29 18-42 36-42s34 13 36 42z" fill="#D9B451" opacity=".6"/></svg>';

    function render() {
      const p = PAGES[i], person = p.kind === 'person';
      $('person').hidden = !person;
      $('note').hidden = person;
      if (person) {
        const ph = $('photo');
        ph.textContent = '';
        if (p.photo) { const im = new Image(); im.src = p.photo; im.alt = 'Photo of ' + p.name; ph.appendChild(im); }
        else ph.innerHTML = silhouette;
        $('name').textContent = p.name; $('role').textContent = p.role;
        $('good').textContent = p.good; $('funny').textContent = p.funny; $('cool').textContent = p.cool;
      } else {
        $('eyebrow').textContent = p.eyebrow; $('title').textContent = p.title;
        $('quote').textContent = p.quote; $('speech').textContent = p.speech; $('sign').textContent = p.sign;
      }
      $('count').textContent = (i + 1) + '/' + total;
      $('back').disabled = i === 0;
      [...prog.children].forEach((el, n) => el.classList.toggle('on', n <= i));
      const go = $('go');
      go.classList.remove('granted');
      go.textContent = p.last ? 'Back to the beginning' : 'Permission to continue';
      $('stage').scrollTop = 0;
      const pg = $('page');
      pg.classList.remove('enter'); void pg.offsetWidth; pg.classList.add('enter');
      (person ? $('name') : $('title')).focus({ preventScroll: true });
    }

    $('go').addEventListener('click', () => {
      if (busy) return;
      if (PAGES[i].last) { i = 0; render(); return; }
      busy = true;
      $('go').classList.add('granted');
      $('go').textContent = 'Permission granted \u2713';
      setTimeout(() => { busy = false; i++; render(); }, 450);
    });
    $('back').addEventListener('click', () => { if (i > 0 && !busy) { i--; render(); } });

    // Install button (shows only when the browser allows installing)
    let deferred = null;
    const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
    if (!standalone) {
      window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; $('inst').hidden = false; });
      window.addEventListener('appinstalled', () => { $('inst').hidden = true; });
      $('inst').addEventListener('click', async () => {
        if (!deferred) return;
        deferred.prompt(); await deferred.userChoice; deferred = null; $('inst').hidden = true;
      });
    }
    render();
  })();
</script>
